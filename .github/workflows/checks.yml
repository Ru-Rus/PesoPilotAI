name: Development checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install backend dependencies
        run: |
          python3 -m venv backend/.venv
          backend/.venv/bin/python -m pip install -r backend/requirements-dev.txt
      - name: Backend lint and security analysis
        working-directory: backend
        run: |
          .venv/bin/python -m pyflakes app tests smoke_concurrency.py
          .venv/bin/python -m bandit -r app -q
          .venv/bin/python -m alembic heads
      - name: Backend tests and coverage
        working-directory: backend
        run: .venv/bin/python -m pytest -q --cov=app --cov-fail-under=85 --cov-report=term-missing --cov-report=xml:coverage.xml
      - name: Backend dependency audit
        working-directory: backend
        run: .venv/bin/python -m pip_audit -r requirements.txt
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm audit --audit-level=high
          tar --exclude='.next/cache' -czf frontend-build.tgz .next public package.json package-lock.json next.config.ts
      - name: Frontend security HTTP smoke
        working-directory: frontend
        run: |
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3011 > ../frontend-smoke.log 2>&1 &
          frontend_pid=$!
          trap 'kill "$frontend_pid"' EXIT
          node scripts/smoke-security.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: development-evidence
          path: |
            backend/coverage.xml
            frontend/frontend-build.tgz
          retention-days: 7
